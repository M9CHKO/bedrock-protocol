plugins {
    id "com.android.application"
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def minecraftDataVersion = "1.21.100"
def minecraftDataSource = file(
    "${rootProject.projectDir}/../../data/minecraft-data/bedrock/${minecraftDataVersion}"
)
def generatedMinecraftAssets = file(
    "${layout.buildDirectory.get().asFile}/generated/minecraftDataAssets"
)

tasks.register("generateMinecraftDataAssets") {
    def blocks = new File(minecraftDataSource, "blocks.json")
    def states = new File(minecraftDataSource, "blockStates.json")
    def collisions = new File(minecraftDataSource, "blockCollisionShapes.json")
    def javaToBedrock = new File(minecraftDataSource, "blocksJ2B.json")
    inputs.files(blocks, states, collisions, javaToBedrock)
    outputs.dir(generatedMinecraftAssets)

    doLast {
        def destination = new File(
            generatedMinecraftAssets,
            "minecraft-data/${minecraftDataVersion}"
        )
        project.delete(generatedMinecraftAssets)
        destination.mkdirs()
        [blocks, states, collisions].each { source ->
            project.copy {
                from source
                into destination
            }
        }

        // Keep the exact Java -> Bedrock state table as a compact TSV asset.
        // APK compression reduces it to roughly 160 KiB, while the runtime
        // can stream it without constructing a multi-megabyte JSON tree.
        def exactMappings = new File(destination, "block-state-j2b.tsv")
        exactMappings.withWriter("UTF-8") { writer ->
            def mapping = new JsonSlurper().parse(javaToBedrock)
            mapping.each { javaState, bedrockState ->
                writer.write(javaState.toString())
                writer.write('\t')
                writer.write(bedrockState.toString())
                writer.write('\n')
            }
        }

        // blocksJ2B contains millions of state combinations. Textures only
        // used to need registry names. Keep the compact one-to-many base-name
        // index too for texture lookup and graceful fallback of custom states.
        def aliases = new TreeMap<String, LinkedHashSet<String>>()
        def mapping = new JsonSlurper().parse(javaToBedrock)
        mapping.each { javaState, bedrockState ->
            def javaName = javaState.toString()
            def bedrockName = bedrockState.toString()
            int javaProperties = javaName.indexOf('[')
            int bedrockProperties = bedrockName.indexOf('[')
            if (javaProperties >= 0) javaName = javaName.substring(0, javaProperties)
            if (bedrockProperties >= 0) {
                bedrockName = bedrockName.substring(0, bedrockProperties)
            }
            if (javaName.startsWith("minecraft:")) {
                javaName = javaName.substring("minecraft:".length())
            }
            if (bedrockName.startsWith("minecraft:")) {
                bedrockName = bedrockName.substring("minecraft:".length())
            }
            aliases.computeIfAbsent(javaName) { new LinkedHashSet<String>() }
                .add(bedrockName)
        }
        def serializable = new TreeMap<String, List<String>>()
        aliases.each { name, values -> serializable.put(name, new ArrayList<>(values)) }
        new File(destination, "block-name-j2b.json").setText(
            JsonOutput.toJson(serializable),
            "UTF-8"
        )
    }
}

android {
    namespace "com.m9chko.bedrockrelay"
    compileSdk 36
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.m9chko.bedrockrelay"
        minSdk 26
        targetSdk 36
        versionCode 45
        versionName "1.2.18"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // Keep test distribution directly installable/upgradable over the
            // previous APKs while compiling native C++ with Release flags.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main.assets.srcDir generatedMinecraftAssets
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("generateMinecraftDataAssets")
}

dependencies {
    implementation "com.android.ndk.thirdparty:openssl:1.1.1q-beta-1"
    testImplementation "junit:junit:4.13.2"
}
